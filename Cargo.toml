[package]
name        = "credman"
version     = "0.2.0"
edition     = "2021"
description = "Per-user credential manager with a root daemon backend"

[[bin]]
name = "credman"
path = "src/main.rs"

[[bin]]
name = "credman-daemon"
path = "src/daemon.rs"

[dependencies]
zeroize     = { version = "1.8", features = ["zeroize_derive"] }
serde       = { version = "1.0", features = ["derive"] }
serde_json  = "1.0"

[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
strip         = true
panic         = "abort"
