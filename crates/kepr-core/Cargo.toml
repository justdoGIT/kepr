[package]
name = "kepr-core"
version = "0.3.0"
edition = "2021"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
readme = "../../README.md"
repository = "https://github.com/justdoGIT/kepr"
keywords = ["credentials", "systemd", "linux", "daemon"]
categories = ["command-line-utilities", "authentication"]

[dependencies]
zeroize = { version = "1.8", features = ["zeroize_derive"] }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0"
