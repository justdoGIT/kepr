name: Docs Deploy

# GH Pages deploy is paused while the repo is private — GitHub Pages
# requires a Pro/Team/Enterprise tier to serve private repos (Free tier
# returns "Resource not accessible by integration" from actions/configure-pages).
# Re-enable the `push` trigger below once the repo is public or the
# account is upgraded. Manual `workflow_dispatch` remains available so
# the pipeline can still be smoke-tested on demand.
on:
  # push:
  #   branches: [main]
  #   paths:
  #     - 'docs/**'
  #     - '.github/workflows/docs-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

# Queue deploys; never cancel a running one mid-upload, or the Pages
# artefact can land half-uploaded and the site 404s.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      # SHA-pinned per the supply-chain convention established in #19.
      # Dependabot keeps these current.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: npm ci
        run: npm ci

      - name: npm run build
        run: npm run build

      - name: Upload Pages artefact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/out

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages:    write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
