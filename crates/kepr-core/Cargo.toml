[package]
name = "kepr-core"
version = "0.4.0"
edition = "2021"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
readme = "../../README.md"
repository = "https://github.com/justdoGIT/kepr"
keywords = ["credentials", "systemd", "linux", "daemon"]
categories = ["command-line-utilities", "authentication"]

[dependencies]
zeroize = { version = "1.8", features = ["zeroize_derive"] }
serde = { version = "1.0", features = ["derive"] }
libc = "0.2"
getrandom = "0.4"
memchr = "2"
base64 = "0.22"
# T2.01: SigV4 signing (sigv4.rs), shared by sync and the gate.
sha2 = "0.11"
hmac = "0.13"

[dev-dependencies]
serde_json = "1.0"
