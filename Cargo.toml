[package]
name = "kepr"
version = "0.3.0"
edition = "2021"
description = "Per-user credential manager with a root daemon backend"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/"
keywords = ["credentials", "systemd", "linux", "cli", "daemon"]
categories = ["command-line-utilities", "authentication"]

[[bin]]
name = "kepr"
path = "src/main.rs"

[[bin]]
name = "kepr-daemon"
path = "src/daemon.rs"

# Phase 1 ε: docker credential-helper. Implements the docker
# credential-helper protocol (get/store/erase/list over stdin/stdout
# JSON) as a wrapper around `client::send_request`. Same socket, same
# `kepr` group gate as the main CLI — no extra config besides a
# `docker login` pointing at this binary.
[[bin]]
name = "docker-credential-kepr"
path = "src/docker_helper.rs"

[workspace]
members = ["crates/kepr-core"]

[dependencies]
kepr-core = { path = "crates/kepr-core", version = "0.3.0" }
zeroize = { version = "1.8", features = ["zeroize_derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aes-gcm = "0.10"
# `audit_chain` hashes each event with SHA-256 to form an append-only
# chain on `/var/lib/kepr/audit.log`. RustCrypto's `sha2` is the
# standard pure-Rust impl; aes-gcm already pulls related primitives,
# so the marginal binary size is small.
sha2 = "0.10"
# `kepr doctor` calls getgrnam(3) and getgroups(2) to verify the
# invoking user is in the `kepr` group. The std lib has no portable
# wrapper for either, so the libc crate is the lightest dep that
# exposes them. Bin-only — neither the daemon nor kepr-core uses libc
# directly (the daemon's mlockall extern "C" path is hand-written).
libc = "0.2"
# `.kepr.toml` manifest parser. The crate is ~70KB and depends only
# on `serde`/`toml_edit`-internal; the runtime cost is one parse on
# CLI startup, far cheaper than serde_json's existing path. CLI-only —
# the daemon never reads the manifest, so this stays out of kepr-core.
toml = { version = "0.8", default-features = false, features = ["parse"] }
# `kepr sync` cloud-backed credentials. ureq is the smallest sync
# HTTP client in the Rust ecosystem (no async runtime, no Tokio).
# rustls feature gives TLS without OpenSSL system dep, matching the
# rest of kepr's "pure-Rust crypto" stance. Used by sync_vault today;
# future sync_aws / sync_gcp will add their own SDK deps.
ureq = { version = "2.10", default-features = false, features = ["tls", "json"] }

[dev-dependencies]
# Property-based testing. Keeps the random-shrinking corpus outside git
# (proptest writes a `proptest-regressions/` dir on a failure that is
# already in .gitignore via the cargo `target/` rule for failure cases —
# add an explicit ignore line if this dir starts to land in commits).
proptest = "1"
# Per-test writable directories for the in-process AEAD backend tests.
# tempfile auto-cleans on drop so each test gets a hermetic credstore
# without touching /etc/credstore.encrypted/.
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# ── Debian packaging ──────────────────────────────────────────────────────────
# Consumed by `cargo deb`. The systemd unit ships under /lib/systemd/system/
# so the postinst can reload and enable it without pathing tricks.

[package.metadata.deb]
maintainer = "kepr maintainers"
section = "admin"
priority = "optional"
depends = "$auto, systemd, adduser"
extended-description = """
kepr is a per-user credential manager for Linux. An unprivileged
CLI talks to a root systemd service over a Unix socket; the daemon
owns all encryption, decryption, and audit logging. Designed for
hosts where many users need isolated credential storage without
granting sudo."""
assets = [
    ["target/release/kepr",                    "/usr/local/bin/kepr",                   "0755"],
    ["target/release/kepr-daemon",             "/usr/local/sbin/kepr-daemon",           "0700"],
    ["target/release/docker-credential-kepr",  "/usr/local/bin/docker-credential-kepr", "0755"],
    ["systemd/kepr.service",       "/lib/systemd/system/kepr.service","0644"],
    ["completions/kepr.bash",      "/usr/share/bash-completion/completions/kepr", "0644"],
    ["README.md",                  "/usr/share/doc/kepr/README.md",   "0644"],
    ["SECURITY.md",                "/usr/share/doc/kepr/SECURITY.md", "0644"],
    ["LICENSE-MIT",                "/usr/share/doc/kepr/LICENSE-MIT", "0644"],
    ["LICENSE-APACHE",             "/usr/share/doc/kepr/LICENSE-APACHE","0644"],
]
maintainer-scripts = "packaging/debian"
# systemd lifecycle is handled entirely in packaging/debian/postinst
# and prerm. Do NOT set `systemd-units` here — it would require a
# #DEBHELPER# token in postinst and a .service file under
# packaging/debian/, duplicating state we already manage manually.

# ── RPM packaging ─────────────────────────────────────────────────────────────
# Consumed by `cargo generate-rpm`. Mirrors the Debian asset map.

[package.metadata.generate-rpm]
license = "MIT OR Apache-2.0"
requires = { systemd = "*", shadow-utils = "*" }
assets = [
    { source = "target/release/kepr",                   dest = "/usr/local/bin/kepr",                   mode = "0755" },
    { source = "target/release/kepr-daemon",            dest = "/usr/local/sbin/kepr-daemon",           mode = "0700" },
    { source = "target/release/docker-credential-kepr", dest = "/usr/local/bin/docker-credential-kepr", mode = "0755" },
    { source = "systemd/kepr.service",       dest = "/lib/systemd/system/kepr.service",mode = "0644" },
    { source = "completions/kepr.bash",      dest = "/usr/share/bash-completion/completions/kepr", mode = "0644" },
    { source = "README.md",                  dest = "/usr/share/doc/kepr/README.md",   mode = "0644", doc = true },
    { source = "SECURITY.md",                dest = "/usr/share/doc/kepr/SECURITY.md", mode = "0644", doc = true },
    { source = "LICENSE-MIT",                dest = "/usr/share/doc/kepr/LICENSE-MIT", mode = "0644", doc = true },
    { source = "LICENSE-APACHE",             dest = "/usr/share/doc/kepr/LICENSE-APACHE",mode = "0644", doc = true },
]
post_install_script = """
getent group kepr >/dev/null || groupadd --system kepr
systemctl daemon-reload || true
systemctl enable --now kepr.service || true
"""
pre_uninstall_script = """
if [ $1 -eq 0 ]; then
    systemctl disable --now kepr.service || true
fi
"""
post_uninstall_script = """
if [ $1 -eq 0 ]; then
    systemctl daemon-reload || true
fi
"""
