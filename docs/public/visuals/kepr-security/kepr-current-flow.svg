<svg data-testid="flow-svg" xmlns="http://www.w3.org/2000/svg" width="980" height="1145" viewBox="0 0 980 1145" role="img" aria-labelledby="flow-title flow-description" style="font-family: system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif; background: rgb(16, 23, 21);"><title id="flow-title">How Kepr works in the current source</title><desc id="flow-description">Local agent, authenticated gate, original-data secret screening, personal-data masks, host-bound credential injection, external provider and screened return. Dashed boxes are proposed controls. API keys never enter model text.</desc><defs><marker id="flow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#a5b8b0" stroke-width="1.5"></path></marker></defs><rect x="16" y="20" width="948" height="749" rx="20" fill="#12201a" stroke="#315c4b" stroke-width="1"></rect><text x="36" y="49" fill="#83b69f" font-size="13" font-weight="700" letter-spacing="2">LOCAL DEVICE · PROTECTED AGENT SESSION</text><text x="944" y="49" text-anchor="end" fill="#adc0b5" font-size="12">CURRENT SOURCE</text><path d="M 490 172 V 210" fill="none" stroke="#a5b8b0" stroke-width="2" marker-end="url(#flow-arrow)" opacity=".8"></path><path d="M 490 312 V 350" fill="none" stroke="#a5b8b0" stroke-width="2" marker-end="url(#flow-arrow)" opacity=".8"></path><path d="M 490 452 V 490" fill="none" stroke="#a5b8b0" stroke-width="2" marker-end="url(#flow-arrow)" opacity=".8"></path><path d="M 490 592 V 630" fill="none" stroke="#a5b8b0" stroke-width="2" marker-end="url(#flow-arrow)" opacity=".8"></path><path d="M 490 732 V 805" fill="none" stroke="#a5b8b0" stroke-width="2" marker-end="url(#flow-arrow)" opacity=".8"></path><path d="M 490 907 V 945" fill="none" stroke="#a5b8b0" stroke-width="2" marker-end="url(#flow-arrow)" opacity=".8"></path><g><rect x="35" y="232" width="244" height="107" rx="12" fill="#18221f" stroke="#f4c36c" stroke-width="1.5"></rect><text x="53" y="260" font-size="15" font-weight="750" fill="#f4c36c">ENCRYPTED STORE</text><text x="53" y="286" font-size="14" fill="#b6c7bf">Daemon validates bindings</text><text x="53" y="309" font-size="14" fill="#b6c7bf">Private resolve channel only</text><text x="53" y="332" font-size="14" fill="#b6c7bf">No daemon socket for agent</text></g><path d="M 279 283 H 324" fill="none" stroke="#f4c36c" stroke-width="2" marker-end="url(#flow-arrow)" opacity=".8"></path><g><rect x="690" y="500" width="248" height="107" rx="12" fill="#18221f" stroke="#37dcc6" stroke-width="1.5"></rect><text x="708" y="528" font-size="15" font-weight="750" fill="#37dcc6">LOCAL PII MAP</text><text x="708" y="554" font-size="14" fill="#b6c7bf">Original ↔ session token</text><text x="708" y="577" font-size="14" fill="#b6c7bf">Memory-only, bounded map</text><text x="708" y="600" font-size="14" fill="#b6c7bf">No automatic restoration</text></g><path d="M 655 544 H 683" fill="none" stroke="#37dcc6" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#flow-arrow)" opacity=".8"></path><g><rect x="690" y="350" width="248" height="107" rx="12" fill="#18221f" stroke="#72b5ff" stroke-width="1.5"></rect><text x="708" y="378" font-size="15" font-weight="750" fill="#72b5ff">LOCAL AUDIT</text><text x="708" y="404" font-size="14" fill="#b6c7bf">Time · session · provider</text><text x="708" y="427" font-size="14" fill="#b6c7bf">Method · path · status</text><text x="708" y="450" font-size="14" fill="#b6c7bf">No prompt bodies by default</text></g><path d="M 655 398 H 683" fill="none" stroke="#72b5ff" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#flow-arrow)" opacity=".8"></path><line x1="35" y1="788" x2="945" y2="788" stroke="#526058" stroke-dasharray="6 6"></line><text x="35" y="808" fill="#ff87a6" font-size="12" font-weight="700" letter-spacing="1.3">NETWORK BOUNDARY · CLOUD IS A THIRD PARTY</text><line x1="35" y1="937" x2="945" y2="937" stroke="#526058" stroke-dasharray="6 6"></line><text x="35" y="963" fill="#83b69f" font-size="12" font-weight="700" letter-spacing="1.3">RETURN TO DEVICE</text><g role="button" tabindex="0" aria-label="AGENT HARNESS details" style="cursor: pointer; opacity: 1;"><rect x="325" y="80" width="330" height="92" rx="12" fill="#1a2420" stroke="#72b5ff" stroke-width="1.5"></rect><circle cx="344" cy="100" r="3" fill="#72b5ff"></circle><text x="362" y="105" font-size="12" fill="#72b5ff" font-weight="650">01</text><text x="343" y="130" font-size="19" font-weight="750" fill="#e9f2ed">AGENT HARNESS</text><text x="343" y="153" font-size="14" fill="#b6c7bf">Session placeholders, no raw keys</text></g><g role="button" tabindex="0" aria-label="AUTHENTICATE REQUEST details" style="cursor: pointer; opacity: 1;"><rect x="325" y="220" width="330" height="92" rx="12" fill="#22372d" stroke="#37dcc6" stroke-width="3"></rect><circle cx="344" cy="240" r="3" fill="#37dcc6"></circle><text x="362" y="245" font-size="12" fill="#37dcc6" font-weight="650">02</text><text x="343" y="270" font-size="19" font-weight="750" fill="#e9f2ed">AUTHENTICATE REQUEST</text><text x="343" y="293" font-size="14" fill="#b6c7bf">Route · placeholder · request budgets</text></g><g role="button" tabindex="0" aria-label="INSPECT ORIGINAL DATA details" style="cursor: pointer; opacity: 1;"><rect x="325" y="360" width="330" height="92" rx="12" fill="#1a2420" stroke="#37dcc6" stroke-width="1.5"></rect><circle cx="344" cy="380" r="3" fill="#37dcc6"></circle><text x="362" y="385" font-size="12" fill="#37dcc6" font-weight="650">03</text><text x="343" y="410" font-size="19" font-weight="750" fill="#e9f2ed">INSPECT ORIGINAL DATA</text><text x="343" y="433" font-size="14" fill="#b6c7bf">Stored secrets + encoded key patterns</text></g><g role="button" tabindex="0" aria-label="MASK PERSONAL DATA details" style="cursor: pointer; opacity: 1;"><rect x="325" y="500" width="330" height="92" rx="12" fill="#1a2420" stroke="#37dcc6" stroke-width="1.5"></rect><circle cx="344" cy="520" r="3" fill="#37dcc6"></circle><text x="362" y="525" font-size="12" fill="#37dcc6" font-weight="650">04 / BASELINE</text><text x="343" y="550" font-size="19" font-weight="750" fill="#e9f2ed">MASK PERSONAL DATA</text><text x="343" y="573" font-size="14" fill="#b6c7bf">Email · phone · IP · personal paths</text></g><g role="button" tabindex="0" aria-label="ADD PROVIDER AUTH details" style="cursor: pointer; opacity: 1;"><rect x="325" y="640" width="330" height="92" rx="12" fill="#1a2420" stroke="#f4c36c" stroke-width="1.5"></rect><circle cx="344" cy="660" r="3" fill="#f4c36c"></circle><text x="362" y="665" font-size="12" fill="#f4c36c" font-weight="650">05</text><text x="343" y="690" font-size="19" font-weight="750" fill="#e9f2ed">ADD PROVIDER AUTH</text><text x="343" y="713" font-size="14" fill="#b6c7bf">The real key goes only to its bound host</text></g><g role="button" tabindex="0" aria-label="EXTERNAL LLM API details" style="cursor: pointer; opacity: 1;"><rect x="325" y="815" width="330" height="92" rx="12" fill="#1a2420" stroke="#bda0ff" stroke-width="1.5"></rect><circle cx="344" cy="835" r="3" fill="#bda0ff"></circle><text x="362" y="840" font-size="12" fill="#bda0ff" font-weight="650">06</text><text x="343" y="865" font-size="19" font-weight="750" fill="#e9f2ed">EXTERNAL LLM API</text><text x="343" y="888" font-size="14" fill="#b6c7bf">Permitted text + provider authentication</text></g><g role="button" tabindex="0" aria-label="SCREEN THE RESPONSE details" style="cursor: pointer; opacity: 1;"><rect x="325" y="955" width="330" height="92" rx="12" fill="#1a2420" stroke="#37dcc6" stroke-width="1.5"></rect><circle cx="344" cy="975" r="3" fill="#37dcc6"></circle><text x="362" y="980" font-size="12" fill="#37dcc6" font-weight="650">07</text><text x="343" y="1005" font-size="19" font-weight="750" fill="#e9f2ed">SCREEN THE RESPONSE</text><text x="343" y="1028" font-size="14" fill="#b6c7bf">Screen key echoes · preserve call links</text></g><g><rect x="35" y="817" width="244" height="107" rx="12" fill="#18221f" stroke="#bda0ff" stroke-width="1.5"></rect><text x="53" y="845" font-size="15" font-weight="750" fill="#bda0ff">PROVIDER CAN SEE</text><text x="53" y="871" font-size="14" fill="#b6c7bf">Permitted request content</text><text x="53" y="894" font-size="14" fill="#b6c7bf">Its authentication account</text><text x="53" y="917" font-size="14" fill="#b6c7bf">Source IP + request timing</text></g><g><rect x="690" y="955" width="248" height="107" rx="12" fill="#18221f" stroke="#f4c36c" stroke-width="1.5"></rect><text x="708" y="983" font-size="15" font-weight="750" fill="#f4c36c">TOOL ACTIONS</text><text x="708" y="1009" font-size="14" fill="#b6c7bf">Explicit MCP grants exist</text><text x="708" y="1032" font-size="14" fill="#b6c7bf">Universal write guard missing</text><text x="708" y="1055" font-size="14" fill="#b6c7bf">Other apps are outside scope</text></g><path d="M 655 1003 H 683" fill="none" stroke="#f4c36c" stroke-width="2" marker-end="url(#flow-arrow)" opacity=".8"></path><text x="490" y="1087" text-anchor="middle" fill="#a5b8b0" font-size="13">PII tokens stay in the response. General rehydration is not implemented.</text><text x="490" y="1113" text-anchor="middle" fill="#6f9681" font-size="12">Solid = current foundation · Dashed = proposed extension · Never restore API keys into prompts or tools</text></svg>