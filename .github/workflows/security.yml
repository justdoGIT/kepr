name: Security

on:
  push:
    branches: [main]
  # Pull requests run these checks only when they can change the result: the
  # dependency manifests, the deny policy, the docs lockfile or this workflow.
  # Pushes to main and the weekly schedule scan everything, so a new advisory
  # is still caught within a week.
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/*/Cargo.toml"
      - "deny.toml"
      - "docs/package.json"
      - "docs/package-lock.json"
      - ".github/workflows/security.yml"
  schedule:
    # Monday 06:00 UTC weekly scan
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-audit:
    name: cargo audit
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  cargo-deny:
    name: cargo deny
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use the cluster toolchain (devsetup-stable)
        if: env.DEVSETUP_RUST_BIN != ''
        run: |
          echo "$DEVSETUP_RUST_BIN" >> "$GITHUB_PATH"
          echo "CARGO_HOME=$RUNNER_TOOL_CACHE/cargo-$DEVSETUP_RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      # Prebuilt and checksum-verified: `cargo install cargo-deny` compiled it from source on every run, and
      # EmbarkStudios/cargo-deny-action is a Docker action, which a self-hosted runner without Docker cannot run.
      - name: Install cargo-deny
        env:
          DENY_VERSION: "0.20.2"
          DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          archive="$RUNNER_TEMP/cargo-deny.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${DENY_VERSION}/cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          printf '%s  %s\n' "$DENY_SHA256" "$archive" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/bin"
          tar --extract --gzip --file "$archive" --strip-components=1 --directory "$RUNNER_TEMP/bin" \
            "cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Check dependency policy
        run: cargo deny check

  npm-audit:
    name: npm audit (docs)
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON_LIGHT || vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: npm audit --audit-level=high
        run: npm audit --audit-level=high

  # CodeQL is disabled while this repo is private — GitHub code scanning
  # on private repos requires GitHub Advanced Security, and without it
  # the job fails with "Resource not accessible by integration" on the
  # `codeql-action/analyze` upload.
  # Re-enable by uncommenting this job when the repo goes public again
  # or when GHAS is enabled on the org. See:
  # https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/about-code-scanning
  #
  # codeql:
  #   name: CodeQL (${{ matrix.language }})
  #   runs-on: ubuntu-latest
  #   permissions:
  #     contents: read
  #     security-events: write
  #     actions: read
  #   strategy:
  #     fail-fast: false
  #     matrix:
  #       language: [rust, javascript-typescript]
  #   steps:
  #     - uses: actions/checkout@v7
  #
  #     - name: Install Rust toolchain
  #       if: matrix.language == 'rust'
  #       uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
  #
  #     - uses: github/codeql-action/init@v3
  #       with:
  #         languages: ${{ matrix.language }}
  #         config-file: ./.github/codeql/codeql-config.yml
  #
  #     - name: Build Rust targets
  #       if: matrix.language == 'rust'
  #       run: cargo build --all-targets --release
  #
  #     - uses: github/codeql-action/analyze@v3
  #       with:
  #         category: "/language:${{ matrix.language }}"

  sbom:
    name: SBOM (SPDX)
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON_LIGHT || vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          format: spdx-json
          output-file: kepr.spdx.json
          upload-artifact: true
          dependency-snapshot: true
