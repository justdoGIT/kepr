name: credman CodeQL config

queries:
  - uses: security-extended

paths-ignore:
  - docs/.next/**
  - docs/.source/**
  - docs/node_modules/**
  - target/**

# Intentional print paths (audit fallback, `credman get --export`,
# `ok/err/info` helpers) remain subject to rust/cleartext-logging.
# CodeQL query-filters does not accept a `paths:` sub-field, so
# scoped suppression must be done by dismissing individual alerts
# in the Security tab with reason "Used in tests" / "Won't fix".
