name: Performance measurements

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      seed_baseline:
        description: Create Cargo baselines on this runner for review.
        required: false
        type: boolean
        default: false

jobs:
  performance:
    uses: https://forgejo.kepr.dev/justdoGIT/ci-templates/.forgejo/workflows/reusable-performance.yml@07b435275326935d004abee9fa0f35d2b7c4b2d3
    with:
      runs_on: ci-rust
      runner_label: ci-rust
      templates_ref: 07b435275326935d004abee9fa0f35d2b7c4b2d3
      seed_baseline: ${{ github.event_name == 'workflow_dispatch' && inputs.seed_baseline }}
