name: PR Reviewer Agent

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Cancel superseded runs on repeated `synchronize` pushes during active PR
# iteration — each run consumes OpenRouter's shared 50-requests/day free-tier
# quota (see MODEL_CANDIDATES below), so letting stale runs pile up and
# finish anyway wastes quota on reviews of code that's already been amended.
concurrency:
  group: pr-reviewer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  agent-review:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON_LIGHT || vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 10
    # Not for drafts (reviewed when marked ready) and not for Dependabot, which
    # cannot read the OpenRouter secret, so its run could only fail.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.draft != true
      && github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # ── Step 1: Measure diff size ──────────────────────────────────────
      - name: Measure diff size
        id: diff_size
        env:
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          DIFF_LINES="0"
          if [[ -n "$BASE_SHA" && -n "$HEAD_SHA" ]] && git cat-file -e "$BASE_SHA" 2>/dev/null; then
            DIFF_LINES=$(git diff "${BASE_SHA}...${HEAD_SHA}" | wc -l || echo "0")
          elif git rev-parse --verify "origin/${BASE_REF:-main}" >/dev/null 2>&1; then
            DIFF_LINES=$(git diff "origin/${BASE_REF:-main}...HEAD" | wc -l || echo "0")
          elif command -v gh >/dev/null 2>&1; then
            DIFF_LINES=$(gh pr diff "$PR" 2>/dev/null | wc -l || echo "0")
          fi
          echo "lines=$DIFF_LINES" >> "$GITHUB_OUTPUT"
          echo "Diff lines: $DIFF_LINES"
      # ── Step 2: Check for OpenRouter access ─────────────────────────────
      # Free-tier only: every model tried below carries a ":free" OpenRouter
      # suffix (zero token cost). No paid model is ever selected — if every
      # free candidate is unavailable (gated, rate-limited, or down) the run
      # step below exits without commenting rather than falling back to a
      # paid model.
      - name: Check OpenRouter key
        id: provider
        env:
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [[ -n "$OPENROUTER_KEY" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No OPENROUTER_API_KEY configured — skipping agent review"
          fi

      # ── Step 3: Install Pi agent ────────────────────────────────────────
      - name: Setup Node.js
        if: steps.provider.outputs.enabled == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # pi-coding-agent@0.86.1 declares engines.node >=22.19.0 (it imports node:module's enableCompileCache);
          # Node 20 dies with a SyntaxError on import (seen on the hp runner, 2026-10-17).
          node-version: "22"

      - name: Install Pi agent
        if: steps.provider.outputs.enabled == 'true'
        run: npm install -g @earendil-works/pi-coding-agent@0.86.1

      # ── Step 4: Run Pi review ───────────────────────────────────────────
      - name: Run Pi review
        if: steps.provider.outputs.enabled == 'true'
        env:
          DIFF_LINES: ${{ steps.diff_size.outputs.lines }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -eo pipefail

          export PATH="$HOME/.npm-global/bin:/usr/local/bin:$PATH"
          REPO="${GITHUB_REPOSITORY}"

          # Ensure gh CLI is on PATH if available, or install into runner temp
          if ! command -v gh >/dev/null 2>&1; then
            GH_TMP="$RUNNER_TEMP/gh-cli"
            if [[ ! -x "$GH_TMP/bin/gh" ]]; then
              mkdir -p "$GH_TMP"
              curl -fsSL "https://github.com/cli/cli/releases/download/v2.67.0/gh_2.67.0_linux_amd64.tar.gz" 2>/dev/null | tar -xz -C "$GH_TMP" --strip-components=1 2>/dev/null || true
            fi
            [[ -x "$GH_TMP/bin/gh" ]] && export PATH="$GH_TMP/bin:$PATH"
          fi

          post_comment() {
            local body="$1"
            if command -v gh >/dev/null 2>&1; then
              gh pr comment "$PR" --body "$body" 2>/dev/null || true
            else
              curl -fsSL -X POST \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${REPO}/issues/${PR}/comments" \
                -d "$(jq -n --arg b "$body" '{body: $b}')" 2>/dev/null || true
            fi
          }

          post_inline() {
            local body="$1"
            local path="$2"
            local line="$3"
            local sha="$4"
            if command -v gh >/dev/null 2>&1; then
              gh api "repos/${REPO}/pulls/${PR}/comments" \
                -f body="$body" -f path="$path" -f commit_id="$sha" -f line="$line" -f side="RIGHT" 2>/dev/null || true
            else
              curl -fsSL -X POST \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${REPO}/pulls/${PR}/comments" \
                -d "$(jq -n --arg b "$body" --arg p "$path" --arg c "$sha" --argjson l "$line" \
                    '{body: $b, path: $p, commit_id: $c, line: $l, side: "RIGHT"}')" 2>/dev/null || true
            fi
          }

          # Active free-tier OpenRouter candidates
          MODEL_CANDIDATES=(
            "google/gemma-4-31b-it:free"
            "google/gemma-4-26b-a4b-it:free"
            "nvidia/nemotron-3-ultra-550b-a55b:free"
            "nvidia/nemotron-3.5-lightning:free"
            "liquid/lfm-2.5-2.6b:free"
            "cohere/north-mini-code:free"
          )
          # Query live free models from OpenRouter dynamically
          while IFS= read -r live_m; do
            if [[ -n "$live_m" && ! " ${MODEL_CANDIDATES[*]} " =~ " ${live_m} " ]]; then
              MODEL_CANDIDATES+=("$live_m")
            fi
          done < <(curl -s --max-time 5 https://openrouter.ai/api/v1/models | jq -r '.data[] | select(.id | endswith(":free")) | .id' 2>/dev/null || true)

          echo "=== PR #$PR ==="

          DIFF_FILE=$(mktemp)
          REVIEW_FILE=$(mktemp)
          FILTERED_DIFF=$(mktemp)
          PROMPT_FILE=$(mktemp)
          DIFF_ERR=$(mktemp)
          trap 'rm -f "$DIFF_FILE" "$REVIEW_FILE" "$PROMPT_FILE" "$FILTERED_DIFF" "$DIFF_ERR"' EXIT

          # Generate diff via git (native, works without gh)
          if [[ -n "$BASE_SHA" && -n "$HEAD_SHA" ]] && git cat-file -e "$BASE_SHA" 2>/dev/null; then
            git diff "${BASE_SHA}...${HEAD_SHA}" > "$DIFF_FILE" 2>"$DIFF_ERR" || true
          elif git rev-parse --verify "origin/${BASE_REF:-main}" >/dev/null 2>&1; then
            git diff "origin/${BASE_REF:-main}...HEAD" > "$DIFF_FILE" 2>"$DIFF_ERR" || true
          elif command -v gh >/dev/null 2>&1; then
            gh pr diff "$PR" > "$DIFF_FILE" 2>"$DIFF_ERR" || true
          fi

          if [[ ! -s "$DIFF_FILE" ]]; then
            # GitHub diff API fallback via curl if local git diff was empty
            curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github.v3.diff" \
              "https://api.github.com/repos/${REPO}/pulls/${PR}" > "$DIFF_FILE" 2>"$DIFF_ERR" || true
          fi

          if [[ ! -s "$DIFF_FILE" ]]; then
            echo "ERROR: PR diff is empty or could not be generated" >&2
            cat "$DIFF_ERR" >&2
            exit 1
          fi

          echo "Changed files:"
          if [[ -n "$BASE_SHA" && -n "$HEAD_SHA" ]] && git cat-file -e "$BASE_SHA" 2>/dev/null; then
            git diff "${BASE_SHA}...${HEAD_SHA}" --name-only 2>/dev/null | sort || true
          else
            git diff "origin/${BASE_REF:-main}...HEAD" --name-only 2>/dev/null | sort || true
          fi
          echo ""

          # Strip noise: lockfiles and generated assets
          grep -v '^diff --git.*\(Cargo\.lock\|package-lock\.json\|\.min\.js\)' \
            "$DIFF_FILE" > "$FILTERED_DIFF" || true

          # Load review skill from repo
          SKILL_FILE=".github/skills/pr-reviewer/SKILL.md"
          [[ -f "$SKILL_FILE" ]] || SKILL_FILE=".claude/skills/pr-reviewer/SKILL.md"
          if [[ -f "$SKILL_FILE" ]]; then
            SKILL_CONTENT=$(cat "$SKILL_FILE")
            echo "Loaded review skill: $SKILL_FILE"
          else
            echo "WARNING: $SKILL_FILE not found, using fallback"
            SKILL_CONTENT="Review this PR diff for bugs, security issues, and code quality problems. Focus on Rust, Bash, YAML, and TypeScript."
          fi

          {
            printf '%s\n\n' "$SKILL_CONTENT"
            printf '%s\n' '---'
            printf '%s %s lines):\n' 'PR DIFF (read-only audit,' "$DIFF_LINES"
            cat "$FILTERED_DIFF"
          } > "$PROMPT_FILE"

          echo "Prompt size: $(wc -l < "$PROMPT_FILE") lines"

          USED_MODEL=""
          for model in "${MODEL_CANDIDATES[@]}"; do
            echo "=== Agent review (Pi / openrouter / $model) ==="
            # Cap each candidate at 90s: a stalled/overloaded free-tier
            # endpoint must not burn the whole 10-minute job budget on one
            # candidate and starve the rest of the fallback list.
            if timeout 90 pi -p --no-session --no-tools --provider openrouter --model "$model" \
                 < "$PROMPT_FILE" 2>&1 | tee "$REVIEW_FILE"; then
              USED_MODEL="$model"
              echo ""
              echo "=== Succeeded with $model ==="
              break
            fi
            echo ""
            echo "=== $model unavailable, trying next candidate ==="
          done

          # At last, fall back to the current model from which the PR was raised
          if [[ -z "$USED_MODEL" ]]; then
            PR_JSON=$(gh pr view "$PR" --json body,commits 2>/dev/null || echo "{}")
            DETECTED=$(echo "$PR_JSON" | grep -oEi 'model:\s*([a-zA-Z0-9_./:-]+)' | head -n 1 | sed -E 's/.*:[[:space:]]*//' | tr -d '-> ' || true)
            FALLBACK_MODEL="google/gemini-3.8-flash"
            case "$DETECTED" in
              *gemini-3.8*|*gemini*flash*) FALLBACK_MODEL="google/gemini-3.8-flash" ;;
              *claude-3-7*|*claude-3.7*) FALLBACK_MODEL="anthropic/claude-3.7-sonnet" ;;
              *claude*) FALLBACK_MODEL="anthropic/claude-3.5-sonnet" ;;
              *deepseek*) FALLBACK_MODEL="deepseek/deepseek-chat" ;;
              "") FALLBACK_MODEL="google/gemini-3.8-flash" ;;
              *) FALLBACK_MODEL="$DETECTED" ;;
            esac

            echo ""
            echo "=== Free candidates unavailable, falling back to PR source model ($FALLBACK_MODEL) ==="
            if timeout 90 pi -p --no-session --no-tools --provider openrouter --model "$FALLBACK_MODEL" \
                 < "$PROMPT_FILE" 2>&1 | tee "$REVIEW_FILE"; then
              USED_MODEL="$FALLBACK_MODEL"
              echo ""
              echo "=== Succeeded with fallback model $FALLBACK_MODEL ==="
            fi
          fi

          if [[ -z "$USED_MODEL" ]]; then
            echo "WARNING: all free OpenRouter candidates and fallback model failed" >&2
            post_comment "## Pi Agent Review Notice

          Automated review was skipped: OpenRouter free models and fallback model were temporarily unavailable."
            exit 0
          fi

          # ── Post review comments ──────────────────────────────────────
          echo "=== Posting review comments ==="
          if ! grep -q '^FINDING|' "$REVIEW_FILE"; then
            post_comment "## Pi Agent Review (openrouter / $USED_MODEL)

          No issues found in this PR."
            exit 0
          fi

          COMMENT_COUNT=0
          while IFS='|' read -r _ path line severity desc; do
            [[ -n "$path" && -n "$line" ]] || continue
            [[ "$COMMENT_COUNT" -lt 10 ]] || break

            case "$severity" in
              P1) BADGE="![P1](https://img.shields.io/badge/P1-critical-red?style=flat-square)" ;;
              *)   BADGE="![P2](https://img.shields.io/badge/P2-warning-yellow?style=flat-square)" ;;
            esac

            post_inline "$BADGE $desc" "$path" "$line" "$HEAD_SHA"

            COMMENT_COUNT=$((COMMENT_COUNT + 1))
          done < <(grep '^FINDING|' "$REVIEW_FILE")
          echo "Posted $COMMENT_COUNT inline review comments"

          # ── Post summary comment ────────────────────────────────────
          TOTAL=$(grep -c '^FINDING|'           "$REVIEW_FILE" || echo 0)
          P1=$(   grep -c '^FINDING|[^|]*|[^|]*|P1|' "$REVIEW_FILE" || echo 0)
          P2=$(   grep -c '^FINDING|[^|]*|[^|]*|P2|' "$REVIEW_FILE" || echo 0)

          SUMMARY_TMP=$(mktemp)
          {
            printf '## Pi Agent Review (%s / %s)\n\n' "openrouter" "$USED_MODEL"
            printf '_Diff: %s lines | Findings: %s (P1=%s P2=%s)_\n\n' \
              "$DIFF_LINES" "$TOTAL" "$P1" "$P2"
            printf '| Severity | File | Line | Description |\n'
            printf '|----------|------|------|-------------|\n'
            while IFS='|' read -r _ path line severity desc; do
              [[ -n "$path" ]] || continue
              printf '| %s | `%s` | %s | %s |\n' "$severity" "$path" "$line" "$desc"
            done < <(grep '^FINDING|' "$REVIEW_FILE")
          } > "$SUMMARY_TMP"
          post_comment "$(cat "$SUMMARY_TMP")"
          rm -f "$SUMMARY_TMP"
