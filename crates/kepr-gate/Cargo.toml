[package]
name = "kepr-gate"
version = "0.4.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Credential-injecting local proxy for kepr agent sessions"
publish = false

# hyper/tokio/rustls live in this crate only, so they never reach the
# daemon's dependency tree (agent vault plan decision 1).
[dependencies]
kepr-core = { path = "../kepr-core" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync"] }
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1", "server"] }
http-body-util = "0.1"
bytes = "1"
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "webpki-roots", "ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
zeroize = "1.8"
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
getrandom = "0.4"
memchr = "2"
base64 = "0.23"
# P2.1 egress proxy: the per-session CA and leaf certificates (ring
# backend, same as rustls here) and the TLS server side.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
time = "0.3"
# P7.1 database proxy: TLS to the server with the same compiled-in roots.
webpki-roots = "1"
# T7.08: RS256 GitHub App JWTs (already in the tree through rustls).
ring = "0.17"
# T12.44: a fips gate signs those JWTs with aws-lc-rs (already in the tree
# through rustls' aws-lc-rs feature).
aws-lc-rs = { version = "1.18", optional = true }
# T12.07: inflate gzip git upload-pack bodies for the DLP scan (pure-Rust
# backend; already in the lock through the root crate).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[features]
# T7.16 FIPS mode: rustls and the session CA (rcgen) on aws-lc-rs instead of
# ring (src/tls_provider.rs). Add `rustls/fips` for the validated module.
fips = ["rustls/aws-lc-rs", "rcgen/aws_lc_rs", "dep:aws-lc-rs", "kepr-core/fips"]

[dev-dependencies]
tokio = { version = "1", features = ["macros"] }
