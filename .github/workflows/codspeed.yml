name: CodSpeed

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets CodSpeed trigger backtest runs to build initial history.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC authentication with CodSpeed

concurrency:
  group: codspeed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Install cargo-codspeed
        uses: taiki-e/install-action@4684b8405694ae9dd42c9f39ba901a70ae83f4a3 # v2
        with:
          tool: cargo-codspeed

      - name: Build the benchmarks
        run: cargo codspeed build -m simulation -p kepr-core

      - name: Run the benchmarks
        uses: CodSpeedHQ/action@821a40cd6c80e3cfe387caf55668287addd808da # v5.5.0
        with:
          mode: simulation
          run: cargo codspeed run -p kepr-core
