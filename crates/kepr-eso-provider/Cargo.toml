[package]
name = "kepr-eso-provider"
version = "0.1.0"
edition = "2021"
description = "External Secrets Operator webhook provider bridge for kepr"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aikepeer/kepr.git"
keywords = ["kubernetes", "external-secrets", "credentials", "webhook"]
categories = ["command-line-utilities"]

[[bin]]
name = "kepr-eso-provider"
path = "src/main.rs"

[dependencies]
kepr-core = { path = "../kepr-core", version = "0.3.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
