name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to (re)release, e.g. v0.2.0"
        required: true

permissions:
  contents: read

jobs:
  # ─── 1. Verify tag matches Cargo.toml version ──────────────────────────────
  tag-check:
    name: Tag matches Cargo.toml
    runs-on: ubuntu-latest
    outputs:
      tag:     ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Default fetch-depth:1 checks out only the target commit and
          # loses the distinction between an annotated tag object and a
          # lightweight one -- `git cat-file -t refs/tags/$TAG` below
          # then reports "commit" even for a genuinely annotated tag,
          # failing every release. Full history/tags avoids that.
          fetch-depth: 0
          persist-credentials: false

      - id: resolve
        env:
          REF_NAME:     ${{ github.ref_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${DISPATCH_TAG:-$REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo "::error::release pushes must come from a v* tag"
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::release tag must be vMAJOR.MINOR.PATCH with an optional prerelease"
            exit 1
          fi
          COMMIT=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          if ! git merge-base --is-ancestor "$COMMIT" refs/remotes/origin/main; then
            echo "::error::release commit must belong to main"
            exit 1
          fi
          if [ "$(git cat-file -t "refs/tags/$TAG" 2>/dev/null || true)" != "tag" ]; then
            echo "::error::$TAG must be an annotated tag"
            exit 1
          fi
          VERSION="${TAG#v}"
          CRATE_VERSION=$(git show "refs/tags/$TAG:Cargo.toml" | grep -m1 '^version' | cut -d'"' -f2)
          if [ "$VERSION" != "$CRATE_VERSION" ] && [ "${VERSION%-*}" != "$CRATE_VERSION" ]; then
            echo "::error::tag $TAG (version $VERSION) does not match Cargo.toml version $CRATE_VERSION"
            exit 1
          fi
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "commit=$COMMIT"
          } >> "$GITHUB_OUTPUT"

  # SEC-012: validate the immutable tagged commit on a disposable Linux runner.
  # This job has no signing identity, no persistent build cache and no secrets.
  qualify:
    name: Qualify exact release commit (Linux)
    needs: tag-check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag-check.outputs.commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: Format, lint and workspace tests
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-targets --locked
          cargo test --manifest-path crates/kepr-pam/Cargo.toml --locked
      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --locked --version 0.21.2
      - name: Audit release lockfiles against current advisories
        run: |
          cargo audit --file Cargo.lock
          cargo audit --file crates/kepr-pam/Cargo.lock
      - name: Install checksum-verified cargo-deny
        env:
          DENY_VERSION: "0.20.2"
          DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          archive="$RUNNER_TEMP/cargo-deny.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${DENY_VERSION}/cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          printf '%s  %s\n' "$DENY_SHA256" "$archive" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/bin"
          tar --extract --gzip --file "$archive" --strip-components=1 --directory "$RUNNER_TEMP/bin" \
            "cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Check dependency policy
        run: cargo deny check

  # ─── 2. Build binaries and package deb/rpm/tar (no signing identity) ───────
  # Everything that compiles third-party code runs here, in a job without
  # `id-token`: a build script or the cargo-deb / cargo-generate-rpm sources
  # cannot ask GitHub for an OIDC token. Signing is the next job.
  build:
    name: Build + package (x86_64)
    needs: [tag-check, qualify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.tag-check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_dispatch may target an older tag — pin to the
          # resolved tag, not whatever main currently points at.
          ref: ${{ needs.tag-check.outputs.commit }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          # Exact: a re-run of a tag builds with the same compiler. 1.88,
          # not the 1.87 MSRV of the root crates (ci.yml): kepr-gate's
          # certificate crates (rcgen, time 0.3.47+, the fix for
          # RUSTSEC-2026-0009) need it, and the gate ships in the packages.
          toolchain: 1.88.0

      # T12.38: no build cache (a cache another run wrote could change what
      # this build compiles). Sources come from Cargo.lock only, fetched
      # here, before the build loses the network.
      - name: Fetch locked sources
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path crates/kepr-pam/Cargo.toml

      # The build runs in a network namespace with no interfaces. The probe
      # must fail, which proves there is no network; --frozen keeps cargo on
      # Cargo.lock and the fetched sources. Build scripts and proc macros run
      # as the runner user, who has sudo and docker access: setpriv drops the
      # supplementary groups (docker.sock is a path, reachable from any
      # network namespace) and capabilities and sets no_new_privs, so sudo
      # cannot raise the privileges of anything it starts.
      - name: cargo build --release (no network)
        run: |
          set -euo pipefail
          sudo unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups --no-new-privs --inh-caps=-all --bounding-set=-all env PATH="$PATH" HOME="$HOME" CARGO_NET_OFFLINE=true sh -c '! curl -fsS --max-time 5 https://index.crates.io/config.json && ! sudo -n true && cargo build --release --frozen --bins && cargo build --release --frozen -p kepr-gate && cargo build --release --frozen --manifest-path crates/kepr-pam/Cargo.toml --target-dir target/pam'

      # Build scripts could write anywhere the runner user can: the checked
      # out tree, or a cargo config in the home directory that the
      # un-isolated steps below would read. Nothing outside target/ may have
      # changed, no cargo config may exist, and the binaries' hashes are
      # kept to be checked again before they are packaged.
      - name: Check what the isolated build touched
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain --ignored | grep -v '^!! target/' || true)" ]; then
            git status --porcelain --ignored | grep -v '^!! target/'
            echo "::error::the isolated build changed files outside target/"
            exit 1
          fi
          for c in "$HOME/.cargo/config" "$HOME/.cargo/config.toml" "${CARGO_HOME:-$HOME/.cargo}/config" "${CARGO_HOME:-$HOME/.cargo}/config.toml" .cargo/config; do
            if [ -e "$c" ]; then echo "::error::cargo config appeared: $c"; exit 1; fi
          done
          sha256sum target/release/kepr target/release/kepr-daemon target/release/kepr-gate \
            target/release/docker-credential-kepr target/release/git-credential-kepr \
            target/pam/release/libpam_kepr.so > "$RUNNER_TEMP/binaries.sha256"

      # Exact versions, the newest that build on the pinned toolchain
      # (cargo-deb 3.7+ and cargo-generate-rpm 0.21 need Rust 1.88).
      - name: Install cargo-deb and cargo-generate-rpm
        run: |
          cargo install cargo-deb --locked --version 3.6.4
          cargo install cargo-generate-rpm --locked --version 0.20.0

      - name: Check the binaries are the ones that were built
        run: sha256sum --check --strict "$RUNNER_TEMP/binaries.sha256"

      - name: cargo deb
        run: cargo deb --no-build --output "dist/kepr_${VERSION}_amd64.deb"

      - name: cargo generate-rpm
        run: cargo generate-rpm --output "dist/kepr-${VERSION}-1.x86_64.rpm"

      - name: Build tarball
        run: |
          set -euo pipefail
          STAGE="kepr-${VERSION}-x86_64-linux"
          mkdir -p "dist/${STAGE}"
          cp target/release/kepr                   "dist/${STAGE}/"
          cp target/release/kepr-daemon            "dist/${STAGE}/"
          cp target/release/kepr-gate              "dist/${STAGE}/"
          cp target/release/docker-credential-kepr "dist/${STAGE}/"
          cp target/release/git-credential-kepr    "dist/${STAGE}/"
          cp systemd/kepr.service                  "dist/${STAGE}/"
          cp systemd/kepr-gate.service             "dist/${STAGE}/"
          cp systemd/polkit/io.kepr.policy         "dist/${STAGE}/"
          cp completions/kepr.bash      "dist/${STAGE}/"
          # Unlock at login and the desktop Secret Service (T13.27, T13.28):
          # the PAM module, its Debian profile and the user units.
          cp target/pam/release/libpam_kepr.so "dist/${STAGE}/pam_kepr.so"
          mkdir -p "dist/${STAGE}/packaging/pam-configs" "dist/${STAGE}/systemd/user"
          cp packaging/pam-configs/kepr "dist/${STAGE}/packaging/pam-configs/kepr"
          cp systemd/user/*.service systemd/user/*.timer "dist/${STAGE}/systemd/user/"
          # install.sh loads the agent sandbox's AppArmor profile from here.
          mkdir -p "dist/${STAGE}/packaging/apparmor"
          cp packaging/apparmor/kepr    "dist/${STAGE}/packaging/apparmor/kepr"
          cp install.sh README.md SECURITY.md LICENSE-MIT LICENSE-APACHE "dist/${STAGE}/"
          tar -C dist -czf "dist/${STAGE}.tar.gz" "${STAGE}"
          rm -rf "dist/${STAGE}"

      - name: List artefacts
        run: ls -la dist/

      - name: Upload unsigned dist/
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kepr-unsigned
          path: dist/
          if-no-files-found: error

  # ─── 2b. SBOM, signatures, attestation (no compiler runs here) ─────────────
  sign:
    name: Sign + attest
    needs: [tag-check, qualify, build]
    runs-on: ubuntu-latest
    permissions:
      contents:     read
      id-token:     write   # cosign keyless
      attestations: write   # build provenance
    outputs:
      version: ${{ needs.tag-check.outputs.version }}
      hashes:  ${{ steps.hash.outputs.hashes }}
    env:
      VERSION: ${{ needs.tag-check.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: kepr-unsigned
          path: dist/

      - name: Generate SBOM per artefact (SPDX-JSON)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: dist/
          format: spdx-json
          output-file: dist/kepr-${{ env.VERSION }}.spdx.json
          upload-artifact: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.3

      - name: Sign release artefacts (keyless)
        working-directory: dist
        run: |
          set -euo pipefail
          # Emit sig + cert + bundle. The bundle (sig+cert+Rekor entry)
          # is the modern single-file verification input for cosign; the
          # separate .sig/.pem pair is kept for older tooling.
          for f in *.deb *.rpm *.tar.gz *.spdx.json; do
            cosign sign-blob --yes \
              --output-signature   "${f}.sig" \
              --output-certificate "${f}.pem" \
              --bundle             "${f}.bundle" \
              "${f}"
          done

      # GitHub's attestation API is unavailable for user-owned private repos
      # (returns 403 regardless of the `attestations: write` permission). Skip
      # this step when the repo is private; cosign keyless signatures above
      # already provide Rekor-backed provenance. If the repo is later made
      # public, this step will start running again with no further changes.
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz

      # Subjects for the SLSA provenance job: `sha256sum` lines, base64.
      - name: Hash release artefacts
        id: hash
        working-directory: dist
        run: |
          set -euo pipefail
          echo "hashes=$(sha256sum -- *.deb *.rpm *.tar.gz | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Upload dist/ as workflow artefact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kepr-release
          path: dist/
          if-no-files-found: error

  # ─── 3. SLSA provenance (generic generator) ───────────────────────────────
  provenance:
    name: SLSA provenance
    needs: sign
    permissions:
      actions:  read    # the generator reads the workflow path
      id-token: write   # keyless signing of the provenance
      contents: write   # requested by the generator's upload job (unused here)
    # Called by tag, not commit SHA: the generator checks its own ref, and
    # slsa-verifier matches the builder ID against that tag.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.sign.outputs.hashes }}
      provenance-name: kepr-${{ needs.sign.outputs.version }}.intoto.jsonl
      # The release job attaches it, so one job creates the release.
      upload-assets: false
      # Logs the repository name in the public Rekor log, which the cosign
      # keyless signatures above already do.
      private-repository: true

  # ─── 4. Generate changelog ────────────────────────────────────────────────
  changelog:
    name: Generate changelog
    needs: tag-check
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.cliff.outputs.content }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Same reason as the build job — re-runs may target an older tag.
          ref: ${{ needs.tag-check.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2
        with:
          # Pin to a known git-cliff version so re-running the release
          # workflow against the same tag produces an identical changelog.
          tool: git-cliff@2.12.0

      - id: cliff
        env:
          TAG:     ${{ needs.tag-check.outputs.tag }}
          VERSION: ${{ needs.tag-check.outputs.version }}
          REPO:    ${{ github.repository }}
        run: |
          # GITHUB_OUTPUT heredoc delimiter must not appear in the body
          # (per docs.github.com/actions/.../workflow-commands#multiline-strings).
          # uuidgen makes collision impossible.
          DELIM="$(uuidgen)"
          BODY="$(git-cliff --config cliff.toml --current --strip header)"
          # How to verify, appended to every release's notes (SECURITY.md).
          # No backticks: this heredoc expands variables.
          BODY="${BODY}
          $(cat <<EOF

          ### Verify this release

          SLSA provenance for the .deb, .rpm and tarball is in kepr-${VERSION}.intoto.jsonl:

              slsa-verifier verify-artifact kepr-${VERSION}-x86_64-linux.tar.gz \\
                --provenance-path kepr-${VERSION}.intoto.jsonl \\
                --source-uri github.com/${REPO} --source-tag ${TAG}

          Every file also carries a cosign bundle (FILE.bundle):

              cosign verify-blob FILE --bundle FILE.bundle \\
                --certificate-identity-regexp '^https://github.com/${REPO}/[.]github/workflows/release[.]yml@' \\
                --certificate-oidc-issuer https://token.actions.githubusercontent.com

          Details: SECURITY.md, section "Verifying a release".
          EOF
          )"
          {
            printf 'content<<%s\n' "$DELIM"
            printf '%s\n'          "$BODY"
            printf '%s\n'          "$DELIM"
          } >> "$GITHUB_OUTPUT"

  # ─── 5. Create the GitHub Release and upload assets ───────────────────────
  release:
    name: Publish release
    needs: [sign, provenance, changelog, tag-check, qualify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: kepr-release
          path: dist/

      - name: Download SLSA provenance
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.tag-check.outputs.tag }}
          name:     kepr ${{ needs.tag-check.outputs.tag }}
          body:     ${{ needs.changelog.outputs.body }}
          draft:    false
          prerelease: ${{ contains(needs.tag-check.outputs.version, '-') }}
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/*.spdx.json
            dist/*.sig
            dist/*.pem
            dist/*.bundle
            dist/*.intoto.jsonl
