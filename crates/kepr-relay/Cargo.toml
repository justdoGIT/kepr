[package]
name = "kepr-relay"
version = "0.4.0"
edition = "2021"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
description = "Optional blob relay for kepr one-time share links (fetch-and-delete)"
publish = false

# T6.04: std only (TcpListener, a thread per connection), no async
# runtime and no dependencies. The relay stores opaque, already
# encrypted blobs; the key of a link never reaches it.

[lib]
path = "src/lib.rs"

[[bin]]
name = "kepr-relay"
path = "src/main.rs"
