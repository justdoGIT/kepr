apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: kepr
spec:
  provider:
    webhook:
      url: "http://kepr-eso-provider:8080/v1/secrets/{{ .remoteRef.key }}"
      method: GET
      timeout: 10s
      headers:
        Authorization: "Bearer {{ .auth.token }}"
      secrets:
        - name: auth
          secretRef:
            name: kepr-eso-provider-auth
            namespace: default
      result:
        jsonPath: "$.value"
