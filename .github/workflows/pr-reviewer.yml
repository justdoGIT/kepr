name: PR Reviewer Agent

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  agent-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ── Step 1: Measure diff size ──────────────────────────────────────
      - name: Measure diff size
        id: diff_size
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          DIFF_LINES=$(gh pr diff "$PR" 2>/dev/null | wc -l || echo "0")
          echo "lines=$DIFF_LINES" >> "$GITHUB_OUTPUT"
          if   [ "$DIFF_LINES" -lt 50  ]; then effort="low"
          elif [ "$DIFF_LINES" -lt 300 ]; then effort="medium"
          else                                  effort="high"
          fi
          echo "effort=$effort" >> "$GITHUB_OUTPUT"
          echo "Diff lines: $DIFF_LINES → effort: $effort"

      # ── Step 2: Select model based on effort ────────────────────────────
      - name: Select model
        id: provider
        env:
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          EFFORT: ${{ steps.diff_size.outputs.effort }}
        run: |
          if [ -n "$DEEPSEEK_KEY" ]; then
            echo "enabled=true"   >> "$GITHUB_OUTPUT"
            echo "provider=deepseek" >> "$GITHUB_OUTPUT"
            case "$EFFORT" in
              low)    main="deepseek-v4-flash" ; sub="deepseek-v4-flash" ;;
              medium) main="deepseek-v4-flash" ; sub="deepseek-v4-flash" ;;
              *)      main="deepseek-v4-flash"   ; sub="deepseek-v4-flash" ;;
            esac
            echo "model=$main"         >> "$GITHUB_OUTPUT"
            echo "subagent_model=$sub" >> "$GITHUB_OUTPUT"
            echo "Using DeepSeek — main: $main  sub: $sub  effort: $EFFORT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No DEEPSEEK_API_KEY configured — skipping agent review"
          fi

      # ── Step 3: Install Pi agent ────────────────────────────────────────
      - name: Setup Node.js
        if: steps.provider.outputs.enabled == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"

      - name: Install Pi agent
        if: steps.provider.outputs.enabled == 'true'
        run: npm install -g @earendil-works/pi-coding-agent@0.86.1

      # ── Step 4: Run Pi review ───────────────────────────────────────────
      - name: Run Pi review
        if: steps.provider.outputs.enabled == 'true'
        env:
          PROVIDER: ${{ steps.provider.outputs.provider }}
          MAIN_MODEL: ${{ steps.provider.outputs.model }}
          SUB_MODEL: ${{ steps.provider.outputs.subagent_model }}
          EFFORT: ${{ steps.diff_size.outputs.effort }}
          DIFF_LINES: ${{ steps.diff_size.outputs.lines }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eo pipefail

          export ANTHROPIC_BASE_URL="https://api.deepseek.com/anthropic"
          export ANTHROPIC_AUTH_TOKEN="$DEEPSEEK_API_KEY"

          export PATH="$HOME/.npm-global/bin:/usr/local/bin:$PATH"

          echo "=== PR #$PR | provider: $PROVIDER | model: $MAIN_MODEL | effort: $EFFORT ==="

          DIFF_FILE=$(mktemp)
          REVIEW_FILE=$(mktemp)
          FILTERED_DIFF=$(mktemp)
          PROMPT_FILE=$(mktemp)
          trap 'rm -f "$DIFF_FILE" "$REVIEW_FILE" "$PROMPT_FILE" "$FILTERED_DIFF"' EXIT

          if ! gh pr diff "$PR" > "$DIFF_FILE" 2>/dev/null; then
            echo "ERROR: gh pr diff failed" >&2
            exit 1
          fi
          if [ ! -s "$DIFF_FILE" ]; then
            echo "ERROR: PR diff is empty" >&2
            exit 1
          fi

          echo "Changed files:"
          gh pr diff "$PR" --name-only 2>/dev/null | sort || true
          echo ""

          # Strip noise: lockfiles and generated assets
          grep -v '^diff --git.*\(Cargo\.lock\|package-lock\.json\|\.min\.js\)' \
            "$DIFF_FILE" > "$FILTERED_DIFF" || true

          # Load review skill from repo
          SKILL_FILE=".claude/skills/pr-reviewer/SKILL.md"
          if [ -f "$SKILL_FILE" ]; then
            SKILL_CONTENT=$(cat "$SKILL_FILE")
            echo "Loaded review skill: $SKILL_FILE"
          else
            echo "WARNING: $SKILL_FILE not found, using fallback"
            SKILL_CONTENT="Review this PR diff for bugs, security issues, and code quality problems. Focus on Rust, Bash, YAML, and TypeScript."
          fi

          {
            printf '%s\n\n' "$SKILL_CONTENT"
            printf '%s\n' '---'
            printf '%s %s lines):\n' 'PR DIFF (read-only audit,' "$DIFF_LINES"
            cat "$FILTERED_DIFF"
          } > "$PROMPT_FILE"

          echo "Prompt size: $(wc -l < "$PROMPT_FILE") lines"

          echo "=== Agent review (Pi / $MAIN_MODEL) ==="
          cat "$PROMPT_FILE" | pi \
            -p \
            --no-session \
            --provider anthropic \
            --model "$MAIN_MODEL" \
            2>&1 | tee "$REVIEW_FILE"
          echo ""

          # ── Post review comments ──────────────────────────────────────
          echo "=== Posting review comments ==="
          if ! grep -q '^FINDING|' "$REVIEW_FILE"; then
            gh pr comment "$PR" --body "## Pi Agent Review ($PROVIDER / $MAIN_MODEL)

          No issues found in this PR." || true
            exit 0
          fi

          COMMENT_COUNT=0
          while IFS='|' read -r _ path line severity desc; do
            [ -n "$path" ] && [ -n "$line" ] || continue
            [ "$COMMENT_COUNT" -lt 10 ] || break

            case "$severity" in
              P1) BADGE="![P1](https://img.shields.io/badge/P1-critical-red?style=flat-square)" ;;
              *)   BADGE="![P2](https://img.shields.io/badge/P2-warning-yellow?style=flat-square)" ;;
            esac

            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/comments" \
              -f body="$BADGE $desc" \
              -f path="$path" \
              -f commit_id="$HEAD_SHA" \
              -f line="$line" \
              -f side="RIGHT" \
              2>/dev/null || true

            COMMENT_COUNT=$((COMMENT_COUNT + 1))
          done < <(grep '^FINDING|' "$REVIEW_FILE")
          echo "Posted $COMMENT_COUNT inline review comments"

          # ── Post summary comment ────────────────────────────────────
          TOTAL=$(grep -c '^FINDING|'           "$REVIEW_FILE" || echo 0)
          P1=$(   grep -c '^FINDING|[^|]*|[^|]*|P1|' "$REVIEW_FILE" || echo 0)
          P2=$(   grep -c '^FINDING|[^|]*|[^|]*|P2|' "$REVIEW_FILE" || echo 0)

          {
            printf '## Pi Agent Review (%s / %s)\n\n' "$PROVIDER" "$MAIN_MODEL"
            printf '_Diff: %s lines | Effort: %s | Findings: %s (P1=%s P2=%s)_\n\n' \
              "$DIFF_LINES" "$EFFORT" "$TOTAL" "$P1" "$P2"
            printf '| Severity | File | Line | Description |\n'
            printf '|----------|------|------|-------------|\n'
            while IFS='|' read -r _ path line severity desc; do
              [ -n "$path" ] || continue
              printf '| %s | `%s` | %s | %s |\n' "$severity" "$path" "$line" "$desc"
            done < <(grep '^FINDING|' "$REVIEW_FILE")
          } | gh pr comment "$PR" --body-file - 2>/dev/null || true
