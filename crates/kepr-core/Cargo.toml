[package]
name = "kepr-core"
version = "0.4.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
readme = "../../README.md"
repository = "https://github.com/justdoGIT/kepr"
keywords = ["credentials", "systemd", "linux", "daemon"]
categories = ["command-line-utilities", "authentication"]

[dependencies]
zeroize = { version = "1.8", features = ["zeroize_derive"] }
serde = { version = "1.0", features = ["derive"] }
libc = "0.2"
getrandom = "0.4"
memchr = "2"
base64 = "0.23"
# T2.01: SigV4 signing (sigv4.rs), shared by sync and the gate.
sha2 = "0.11"
hmac = "0.13"
# T7.02: mysql_native_password scrambles (mysql_wire.rs). Same RustCrypto
# crate and version the root crate already uses for TOTP.
sha1 = "0.11"
# T7.06 (batch aws): stored AWS keys are JSON (sigv4_req.rs); T3.06:
# fdfetch.rs speaks the daemon's JSON protocol. Already in the workspace.
serde_json = "1.0"

# T12.43: with `fips`, mac.rs runs SHA-256, HMAC and PBKDF2 in aws-lc-rs.
aws-lc-rs = { version = "1.18", optional = true }

[features]
fips = ["dep:aws-lc-rs"]

[dev-dependencies]
divan = { version = "5.0.3", package = "codspeed-divan-compat" }

[[bench]]
name = "core"
harness = false
