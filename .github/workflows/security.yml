name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Monday 06:00 UTC weekly scan
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  cargo-deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Check dependency policy
        run: cargo deny check

  npm-audit:
    name: npm audit (docs)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: npm audit --audit-level=high
        run: npm audit --audit-level=high

  # CodeQL is disabled while this repo is private — GitHub code scanning
  # on private repos requires GitHub Advanced Security, and without it
  # the job fails with "Resource not accessible by integration" on the
  # `codeql-action/analyze` upload.
  # Re-enable by uncommenting this job when the repo goes public again
  # or when GHAS is enabled on the org. See:
  # https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/about-code-scanning
  #
  # codeql:
  #   name: CodeQL (${{ matrix.language }})
  #   runs-on: ubuntu-latest
  #   permissions:
  #     contents: read
  #     security-events: write
  #     actions: read
  #   strategy:
  #     fail-fast: false
  #     matrix:
  #       language: [rust, javascript-typescript]
  #   steps:
  #     - uses: actions/checkout@v7
  #
  #     - name: Install Rust toolchain
  #       if: matrix.language == 'rust'
  #       uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
  #
  #     - uses: github/codeql-action/init@v3
  #       with:
  #         languages: ${{ matrix.language }}
  #         config-file: ./.github/codeql/codeql-config.yml
  #
  #     - name: Build Rust targets
  #       if: matrix.language == 'rust'
  #       run: cargo build --all-targets --release
  #
  #     - uses: github/codeql-action/analyze@v3
  #       with:
  #         category: "/language:${{ matrix.language }}"

  sbom:
    name: SBOM (SPDX)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          format: spdx-json
          output-file: kepr.spdx.json
          upload-artifact: true
          dependency-snapshot: true
