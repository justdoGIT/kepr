# git-cliff config — generates CHANGELOG.md from conventional commits.
# See https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to this project are documented here.
This project adheres to [Semantic Versioning](https://semver.org/).
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | split(pat="\\n") | first | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
footer = ""
trim = true
postprocessors = []

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
  { message = "^feat",     group = "Features"        },
  { message = "^fix",      group = "Bug fixes"       },
  { message = "^perf",     group = "Performance"     },
  { message = "^refactor", group = "Refactors"       },
  { message = "^doc",      group = "Documentation"   },
  { message = "^test",     group = "Tests"           },
  { message = "^chore",    group = "Chores"          },
  { message = "^ci",       group = "CI"              },
  { message = "^build",    group = "Build"           },
  # The existing repo uses "credman:" / "docs:" prefixes — map those too.
  { message = "^credman:",    group = "credman"      },
  { message = "^docs:",       group = "docs"         },
  { message = "^ci:",         group = "CI"           },
  { body = ".*security",      group = "Security"     },
  { message = ".*",           skip  = false, group = "Other" },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+.*"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "oldest"
