# Cluster-wide release-build baseline: four workers expose 15-16 logical CPUs.
# Six Cargo jobs leave headroom for Cargo, linking, and the operating system.
[build]
jobs = 6

[target.x86_64-unknown-linux-gnu]
# Three frontend threads per rustc request: 6 jobs x 3 threads = 18 slots,
# which fits the cluster's 16-20 logical CPUs without 8 jobs x 6 threads
# oversubscription.
rustflags = ["-Z", "threads=3"]
