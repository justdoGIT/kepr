name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides which jobs a pull request needs. Pushes to main and manual runs
  # always run everything. A draft PR runs nothing until it is ready for review.
  changes:
    name: Changed paths
    # CI_RUNS_ON (repo variable, JSON) selects the runner for the jobs that compile Rust or need system tools, e.g.
    # ["self-hosted","hp"]; CI_RUNS_ON_LIGHT selects it for the jobs that do not (path filter, Go/Python SDKs, docs),
    # e.g. ["self-hosted","light"], and falls back to CI_RUNS_ON. PRs always use disposable GitHub-hosted runners. The variables
    # are used by security.yml and pr-reviewer.yml.
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '"ubuntu-latest"' || vars.CI_RUNS_ON_LIGHT || vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 5
    if: github.event.pull_request.draft != true
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ github.event_name != 'pull_request' || steps.rust.outputs.rust == 'true' }}
      python: ${{ github.event_name != 'pull_request' || steps.some.outputs.python == 'true' }}
      node: ${{ github.event_name != 'pull_request' || steps.some.outputs.node == 'true' }}
      go: ${{ github.event_name != 'pull_request' || steps.some.outputs.go == 'true' }}
      ruby: ${{ github.event_name != 'pull_request' || steps.some.outputs.ruby == 'true' }}
      java: ${{ github.event_name != 'pull_request' || steps.some.outputs.java == 'true' }}
      dotnet: ${{ github.event_name != 'pull_request' || steps.some.outputs.dotnet == 'true' }}
      integrations: ${{ github.event_name != 'pull_request' || steps.some.outputs.integrations == 'true' }}
      templates: ${{ github.event_name != 'pull_request' || steps.some.outputs.templates == 'true' }}
      csi: ${{ github.event_name != 'pull_request' || steps.some.outputs.csi == 'true' }}
      terraform: ${{ github.event_name != 'pull_request' || steps.some.outputs.terraform == 'true' }}
      docs: ${{ github.event_name != 'pull_request' || steps.some.outputs.docs == 'true' }}
    steps:
      # Everything except the directories that have their own jobs below.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: rust
        with:
          predicate-quantifier: every
          filters: |
            rust:
              - '**'
              - '!docs/**'
              - '!sdk/**'
              - '!integrations/**'
              - '!plugins/**'
              - '!**/*.md'
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: some
        with:
          filters: |
            python:
              - 'sdk/python/**'
              - 'integrations/ansible/**'
              - '.github/workflows/ci.yml'
            node:
              - 'sdk/node/**'
              - 'integrations/vscode/**'
              - 'plugins/omp/**'
              - '.github/workflows/ci.yml'
            go:
              - 'sdk/go/**'
              - '.github/workflows/ci.yml'
            ruby:
              - 'sdk/ruby/**'
              - 'integrations/chef/**'
              - 'integrations/puppet/**'
              - '.github/workflows/ci.yml'
            java:
              - 'sdk/java/**'
              - '.github/workflows/ci.yml'
            integrations:
              - 'integrations/raycast/**'
              - 'integrations/iterm2/**'
              - 'integrations/jetbrains/**'
              - 'sdk/java/**'
              - '.github/workflows/ci.yml'
            dotnet:
              - 'sdk/dotnet/**'
              - 'sdk/powershell/**'
              - '.github/workflows/ci.yml'
            templates:
              - 'integrations/ci/**'
              - 'integrations/podman/**'
              - 'integrations/gitlab/**'
              - 'integrations/bitbucket/**'
              - 'integrations/jenkins/**'
              - 'integrations/github-action/**'
              - '.github/workflows/**'
            csi:
              - 'integrations/csi-provider/**'
              - '.github/workflows/ci.yml'
            terraform:
              - 'integrations/terraform-provider-kepr/**'
              - '.github/workflows/ci.yml'
            docs:
              - 'docs/**'
              - '.github/workflows/ci.yml'

  rust:
    name: Rust (${{ matrix.toolchain }})
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '"ubuntu-latest"' || vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        # beta is an early-warning job: it runs on main and manual runs, not on every PR push.
        toolchain: ${{ fromJSON(github.event_name == 'pull_request' && '["1.88.0","stable"]' || '["1.88.0","stable","beta"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        # The cluster runner already carries the pinned devsetup-stable toolchain (manifest/toolchains.yaml in
        # dev-setup) and exports its bin directory as DEVSETUP_RUST_BIN; `stable` uses it there. The MSRV (1.88.0)
        # and beta jobs, and GitHub-hosted runners, install their own.
        if: matrix.toolchain != 'stable' || env.DEVSETUP_RUST_BIN == ''
        # Pinned to a specific commit (stable branch) to prevent supply-chain
        # drift. Dependabot keeps this current.
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - name: Use the cluster toolchain (devsetup-stable)
        if: matrix.toolchain == 'stable' && env.DEVSETUP_RUST_BIN != ''
        # A separate CARGO_HOME: cargo looks for `cargo-clippy` and the like in $CARGO_HOME/bin before PATH, and the
        # runner's shared one holds rustup proxies from the MSRV job, which run the rustup `stable` toolchain instead.
        run: |
          echo "$DEVSETUP_RUST_BIN" >> "$GITHUB_PATH"
          echo "CARGO_HOME=$RUNNER_TOOL_CACHE/cargo-$DEVSETUP_RUST_TOOLCHAIN" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: cargo test --release
        run: cargo test --release --workspace --all-targets --locked

      - name: pam_kepr (own workspace)
        run: cargo test --manifest-path crates/kepr-pam/Cargo.toml --locked

      - name: cargo build --release
        run: cargo build --release --bins

  fips:
    # T7.16: the `fips` feature with AWS-LC's FIPS 140-3 validated module
    # (aws-lc-rs/fips, rustls/fips). Its build needs Go and CMake, both on
    # ubuntu-latest. The `--all-features` lint above links AWS-LC's ordinary
    # build only, which needs just a C compiler.
    name: Rust (FIPS module)
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '"ubuntu-latest"' || vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        if: env.DEVSETUP_RUST_BIN == ''
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - name: Use the cluster toolchain (devsetup-stable)
        if: env.DEVSETUP_RUST_BIN != ''
        run: |
          echo "$DEVSETUP_RUST_BIN" >> "$GITHUB_PATH"
          echo "CARGO_HOME=$RUNNER_TOOL_CACHE/cargo-$DEVSETUP_RUST_TOOLCHAIN" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2

      - name: Go and CMake
        run: go version && cmake --version

      - name: daemon tests, validated module
        run: cargo test --features fips,aws-lc-rs/fips --bin kepr-daemon -- --include-ignored

      - name: core tests, validated module (T12.43)
        run: cargo test -p kepr-core --features fips,aws-lc-rs/fips -- --include-ignored

      - name: gate tests, validated module
        run: cargo test -p kepr-gate --features fips,rustls/fips -- --include-ignored

      - name: gate tests, post-quantum TLS group (T13.01)
        run: cargo test -p kepr-gate --features pq

      - name: release build
        run: |
          cargo build --release --features fips,aws-lc-rs/fips --bin kepr-daemon
          cargo build --release -p kepr-gate --features fips,rustls/fips

  python-sdk:
    name: Python SDK
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '"ubuntu-latest"' || vars.CI_RUNS_ON_LIGHT || vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    needs: changes
    if: needs.changes.outputs.python == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: unittest
        run: python3 -m unittest discover -s sdk/python/tests -v
      - name: Ansible lookup plugin
        run: python3 -m unittest discover -s integrations/ansible/tests -v

  node-sdk:
    name: Node SDK
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '"ubuntu-latest"' || vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    needs: changes
    if: needs.changes.outputs.node == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: omp kepr extension
        run: node --test plugins/omp/kepr/*.test.mjs
      - name: node --test
        working-directory: sdk/node
        run: node --test test/*.test.js
      - name: VS Code extension
        working-directory: integrations/vscode
        run: node --test test/*.test.js

  ruby-sdk:
    name: Ruby SDK
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '"ubuntu-latest"' || vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    needs: changes
    if: needs.changes.outputs.ruby == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: minitest
        working-directory: sdk/ruby
        # ruby/setup-ruby only supports GitHub-hosted images, so on the
        # self-hosted runner (no Ruby installed) say so loudly and skip; on
        # hosted runners Ruby is preinstalled and the tests run.
        run: |
          if ! command -v ruby >/dev/null; then
            echo "::warning title=Ruby SDK tests skipped::ruby is not installed on this runner"
            exit 0
          fi
          ruby test/test_kepr.rb
          ruby ../../integrations/chef/test/test_lookup.rb
          ruby ../../integrations/puppet/test/test_lookup.rb

  editor-integrations:
    name: Raycast, iTerm2, JetBrains parsing
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '"ubuntu-latest"' || vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    needs: changes
    if: needs.changes.outputs.integrations == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Raycast (node)
        run: node --test integrations/raycast/test/*.test.js
      - name: iTerm2 (python)
        run: python3 -m unittest discover -s integrations/iterm2/test
      - name: JetBrains (java)
        # GitHub-hosted images ship a JDK; a self-hosted runner without one says so and skips.
        run: |
          if ! command -v javac >/dev/null; then
            echo "::warning title=JetBrains tests skipped::javac is not installed on this runner"
            exit 0
          fi
          bash integrations/jetbrains/test.sh

  dotnet-sdk:
    name: .NET SDK
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '"ubuntu-latest"' || vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    needs: changes
    if: needs.changes.outputs.dotnet == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: dotnet test
        # GitHub-hosted images ship the .NET SDK; a self-hosted runner without it says so and skips.
        run: |
          if ! command -v dotnet >/dev/null; then
            echo "::warning title=.NET SDK tests skipped::dotnet is not installed on this runner"
            exit 0
          fi
          dotnet test sdk/dotnet/tests

  powershell-sdk:
    name: PowerShell module
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '"ubuntu-latest"' || vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    needs: changes
    if: needs.changes.outputs.dotnet == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: build the assembly and run Pester
        run: |
          if ! command -v dotnet >/dev/null || ! command -v pwsh >/dev/null; then
            echo "::warning title=PowerShell module tests skipped::dotnet or pwsh is not installed on this runner"
            exit 0
          fi
          dotnet build sdk/dotnet/src -c Release -o sdk/powershell/Kepr/lib
          # shellcheck disable=SC2016  # PowerShell expands its own variables.
          pwsh -NoProfile -Command '
            if (-not (Get-Module -ListAvailable Pester | Where-Object Version -ge 5.0.0)) {
              Install-Module Pester -MinimumVersion 5.0.0 -Force -Scope CurrentUser
            }
            $r = Invoke-Pester -Path sdk/powershell/tests -PassThru -Output Detailed
            if ($r.FailedCount -gt 0) { exit 1 }'

  go-sdk:
    name: Go SDK
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '"ubuntu-latest"' || vars.CI_RUNS_ON_LIGHT || vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    needs: changes
    if: needs.changes.outputs.go == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: go vet + test
        working-directory: sdk/go
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...

  ci-templates:
    name: GitHub Action + GitLab template
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '"ubuntu-latest"' || vars.CI_RUNS_ON_LIGHT || vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    needs: changes
    if: needs.changes.outputs.templates == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint (workflows, and the action's inputs via its example)
        env:
          SHELLCHECK_OPTS: --severity=warning
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"
      - name: shellcheck
        run: shellcheck integrations/ci/*.sh
      - name: kepr-ci.sh tests (masking, export, OIDC exchange, GitLab copy)
        run: bash integrations/ci/test_kepr_ci.sh
      - name: Podman secret driver (shellcheck + fake-kepr tests)
        run: |
          shellcheck integrations/podman/kepr-podman-driver integrations/podman/*.sh
          bash integrations/podman/test_kepr_podman_driver.sh
      - name: GitLab template parses
        run: |
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --quiet pyyaml
          python3 -c "import yaml; yaml.safe_load(open('integrations/gitlab/kepr.gitlab-ci.yml'))"

  # batch: platform
  csi-provider:
    name: Secrets Store CSI provider
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '"ubuntu-latest"' || vars.CI_RUNS_ON_LIGHT || vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    needs: changes
    if: needs.changes.outputs.csi == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: go vet + test
        working-directory: integrations/csi-provider
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...

  terraform-provider:
    name: Terraform provider
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '"ubuntu-latest"' || vars.CI_RUNS_ON_LIGHT || vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: go vet + test
        working-directory: integrations/terraform-provider-kepr
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...

  docs:
    name: Docs (Fumadocs)
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '"ubuntu-latest"' || vars.CI_RUNS_ON_LIGHT || vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: npm ci
        run: npm ci

      - name: npm run build
        run: npm run build
