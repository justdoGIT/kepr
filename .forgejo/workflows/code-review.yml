name: PR Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  code-review:
    name: Automated PR Code Review
    runs-on: ci-standard
    steps:
      - name: Run trusted PR reviewer
        uses: https://forgejo.kepr.dev/justdoGIT/ci-templates@07b435275326935d004abee9fa0f35d2b7c4b2d3
        env:
          FORGEJO_TOKEN: ${{ secrets.CI_API_TOKEN || secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          FORGEJO_URL: ${{ github.server_url }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
