# cargo-deny policy for kepr's dependency graph.
# Keep this checked in so local and CI policy checks are identical.

[advisories]
version = 2
ignore = [
    # rsa (Marvin timing attack) affects private-key decryption / signing.
    # kepr uses rsa only to verify RS256 OIDC ID-token signatures with the
    # IdP's public key (T6.13, src/cli_sharing/jwt.rs); no private-key op.
    { id = "RUSTSEC-2023-0071", reason = "rsa is used for public-key signature verification only" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
